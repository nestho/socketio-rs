[workspace]
resolver = "2"
members = [
    "crates/engineio-core",
    "crates/socketio-parser",
    "crates/socketio-server",
    "crates/socketio-adapters",
    "crates/socketio-gateway",
    "crates/sio-migrate-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytes = "1.7"
flate2 = "1.0"
futures-util = "0.3"
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1.4", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sonic-rs = "0.3"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.26"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
engineio-core = { path = "crates/engineio-core" }
socketio-parser = { path = "crates/socketio-parser" }
socketio-server = { path = "crates/socketio-server" }
socketio-adapters = { path = "crates/socketio-adapters" }
