<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="socketio-rs logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Outer card with generous right padding -->
  <rect x="4" y="4" width="892" height="172" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Emblem centered at (96, 90) -->
  <g transform="translate(96, 90)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#rustGrad)" stroke-width="7" stroke-dasharray="16 8"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5"/>
    <circle cx="0" cy="-52" r="5.5" fill="#38bdf8"/>
    <circle cx="45" cy="26" r="5.5" fill="#38bdf8"/>
    <circle cx="-45" cy="26" r="5.5" fill="#38bdf8"/>
    <polygon points="10,-22 -14,-2 -2,-2 -10,22 14,2 2,2" fill="url(#rustGrad)"/>
  </g>

  <!-- Title & Subtitle with clean margin -->
  <text x="186" y="84" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">
    socketio<tspan fill="#f97316">-rs</tspan>
  </text>
  <text x="186" y="116" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Memory-Safe Rust Socket.IO Engine &amp; Polyglot Sidecar Gateway
  </text>

  <!-- Accent underline -->
  <rect x="186" y="132" width="142" height="4" rx="2" fill="url(#rustGrad)"/>
  <rect x="336" y="132" width="96" height="4" rx="2" fill="url(#cyanGrad)"/>
</svg>
