<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%" role="img" aria-label="socketio-rs Architecture and Fanout Performance Animation">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="rustBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="nodeBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
      .desc-text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .badge-text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      
      @keyframes pulseDot {
        0% { transform: scale(0.9); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(0.9); opacity: 0.6; }
      }
      
      @keyframes packetFlowRust {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes packetFlowSlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes barGrowRust {
        0% { width: 0px; }
        100% { width: 340px; }
      }

      @keyframes barGrowNode {
        0% { width: 0px; }
        100% { width: 75px; }
      }

      .pulse-core {
        animation: pulseDot 2.4s ease-in-out infinite;
        transform-origin: center;
      }

      .flow-fast {
        stroke-dasharray: 8 12;
        animation: packetFlowRust 1.2s linear infinite;
      }

      .flow-slow {
        stroke-dasharray: 4 14;
        animation: packetFlowSlow 3.2s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Canvas Container -->
  <rect x="2" y="2" width="916" height="416" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" class="title-text" font-size="18">Real-Time Core Architecture: Zero-Copy Fan-Out vs V8 Single Thread</text>
  <text x="32" y="58" class="desc-text">Comparing 10K connection broadcast throughput, memory density, and backpressure handling</text>

  <!-- Left Column: Legacy Node.js socket.io -->
  <g transform="translate(32, 76)">
    <rect x="0" y="0" width="410" height="318" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Title & Status -->
    <circle cx="24" cy="24" r="7" fill="#ef4444"/>
    <text x="38" y="29" class="title-text" font-size="15" fill="#f87171">Node.js socket.io (V8 Engine)</text>
    <rect x="300" y="14" width="96" height="20" rx="10" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
    <text x="348" y="28" text-anchor="middle" class="badge-text" fill="#fca5a5">Single Core</text>

    <!-- Bottleneck Diagram -->
    <rect x="18" y="52" width="374" height="126" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="32" y="74" class="code-text" fill="#93c5fd">Inbound Event (1 Event)</text>
    
    <!-- V8 Event Loop box -->
    <rect x="32" y="86" width="120" height="54" rx="6" fill="#3b0764" stroke="#9333ea" stroke-width="1.2"/>
    <text x="92" y="110" text-anchor="middle" class="badge-text" fill="#e9d5ff">V8 Event Loop</text>
    <text x="92" y="126" text-anchor="middle" class="desc-text" font-size="10" fill="#c084fc">Serial JSON.parse</text>

    <!-- Path with slow packet animation -->
    <line x1="152" y1="113" x2="220" y2="113" stroke="#f43f5e" stroke-width="2.5" class="flow-slow"/>
    
    <!-- 10k Serial Copies box -->
    <rect x="220" y="86" width="160" height="54" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1.2"/>
    <text x="300" y="108" text-anchor="middle" class="badge-text" fill="#fecaca">Sequential Clones</text>
    <text x="300" y="126" text-anchor="middle" class="desc-text" font-size="10" fill="#fca5a5">10,000 JSON allocations</text>

    <!-- Metric Bars for Node -->
    <text x="18" y="202" class="desc-text" font-size="12">Fan-Out Latency (10K clients)</text>
    <rect x="18" y="210" width="374" height="18" rx="5" fill="#0b1120"/>
    <rect x="18" y="210" width="340" height="18" rx="5" fill="#ef4444" opacity="0.8"/>
    <text x="366" y="224" class="code-text" font-weight="700" fill="#fff" text-anchor="end">~84.0 ms (V8 loop lock)</text>

    <text x="18" y="252" class="desc-text" font-size="12">Memory Footprint / 100K Conn</text>
    <rect x="18" y="260" width="374" height="18" rx="5" fill="#0b1120"/>
    <rect x="18" y="260" width="330" height="18" rx="5" fill="#f59e0b" opacity="0.8"/>
    <text x="366" y="274" class="code-text" font-weight="700" fill="#fff" text-anchor="end">~5.2 GB (~52 KB/conn)</text>

    <text x="18" y="302" class="desc-text" font-size="11" fill="#ef4444">⚠ Unbounded writeBuffer OOM risk (#3582) • Silent cluster drop</text>
  </g>

  <!-- Right Column: socketio-rs (Pure Rust) -->
  <g transform="translate(478, 76)">
    <rect x="0" y="0" width="410" height="318" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    
    <!-- Title & Status -->
    <circle cx="24" cy="24" r="7" fill="#10b981" class="pulse-core"/>
    <text x="38" y="29" class="title-text" font-size="15" fill="#38bdf8">socketio-rs (Rust Engine)</text>
    <rect x="290" y="14" width="106" height="20" rx="10" fill="#082f49" stroke="#0ea5e9" stroke-width="1"/>
    <text x="343" y="28" text-anchor="middle" class="badge-text" fill="#7dd3fc">Multi-Core Ring</text>

    <!-- Architecture Diagram -->
    <rect x="18" y="52" width="374" height="126" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="32" y="74" class="code-text" fill="#38bdf8">Inbound Event (SIMD-JSON sonic-rs)</text>

    <!-- Single Serialize box -->
    <rect x="32" y="86" width="106" height="54" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.2"/>
    <text x="85" y="108" text-anchor="middle" class="badge-text" fill="#bae6fd">1× Serialize</text>
    <text x="85" y="126" text-anchor="middle" class="desc-text" font-size="10" fill="#7dd3fc">Arc&lt;[u8]&gt; Bytes</text>

    <!-- Zero-Copy Fast Flow -->
    <line x1="138" y1="113" x2="204" y2="113" stroke="#38bdf8" stroke-width="3" class="flow-fast"/>

    <!-- Sharded Zero-Copy Fan-Out box -->
    <rect x="204" y="86" width="176" height="54" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
    <text x="292" y="108" text-anchor="middle" class="badge-text" fill="#bbf7d0">Sharded Fan-Out</text>
    <text x="292" y="126" text-anchor="middle" class="desc-text" font-size="10" fill="#86efac">O(1) Atomic Ref Pointers</text>

    <!-- Metric Bars for Rust -->
    <text x="18" y="202" class="desc-text" font-size="12">Fan-Out Latency (10K clients)</text>
    <rect x="18" y="210" width="374" height="18" rx="5" fill="#0b1120"/>
    <rect x="18" y="210" width="48" height="18" rx="5" fill="url(#rustBarGrad)"/>
    <text x="74" y="224" class="code-text" font-weight="700" fill="#fb923c">4.38 ms (19× faster)</text>

    <text x="18" y="252" class="desc-text" font-size="12">Memory Footprint / 100K Conn</text>
    <rect x="18" y="260" width="374" height="18" rx="5" fill="#0b1120"/>
    <rect x="18" y="260" width="62" height="18" rx="5" fill="url(#nodeBarGrad)"/>
    <text x="88" y="274" class="code-text" font-weight="700" fill="#4ade80">~410 MB (12.6× denser)</text>

    <text x="18" y="302" class="desc-text" font-size="11" fill="#38bdf8">✓ 128 KiB / 16 KiB watermarks • Durable CSR Replay • #![forbid(unsafe_code)]</text>
  </g>
</svg>